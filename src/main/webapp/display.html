<h2>Your Score</h2>
<p id="result-score" class="score"></p>

<h2>Your summary</h2>
<p id="result-summary" class="summary"></p>

</main>

<script>
    fetch("display-data.jsp", {
        headers: { "Accept": "application/json" }
    })
    .then(function (response) {
        if (response.status === 204) {
            throw new Error(
                "No verified submission was found. Please complete the test first."
            );
        }

        if (!response.ok) {
            throw new Error(
                "The submission could not be loaded. Please try again."
            );
        }

        return response.json();
    })
    .then(function (data) {
        document.getElementById("result-name").textContent = data.name;
        document.getElementById("result-email").textContent = data.email;
        document.getElementById("result-summary").textContent = data.summary;

        // Display score out of 4
        
document.getElementById("result-score").textContent =
    data.score + " / " + data.totalScore;


        document.getElementById("loading").hidden = true;
        document.getElementById("result").hidden = false;
    })
    .catch(function (error) {
        document.getElementById("loading").hidden = true;

        var message = document.getElementById("error");
        message.textContent = error.message;
        message.hidden = false;
    });
</script>
</body>
</html>
